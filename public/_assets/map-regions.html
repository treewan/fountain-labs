<script src="/_assets/25cd02ae486cc506.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>

</head><body>
<svg id="m"></svg>
<script>
const W = 1470, H = 620, STEP = 20, R = 1.8;
const svg = d3.select('#m').attr('viewBox', `0 0 ${W} ${H}`);
const proj = d3.geoEquirectangular().rotate([-11, 0]);
const regions = {
  china: { ids: [156], color: '#FF7A00', n: '50M', t: 'China', sub: 'Construction · Inspection · Maintenance · Logistics', at: [104, 36], to: [86, 58], anchor: 'end' },
  sea: { ids: [704, 360, 608, 458, 764, 702], color: '#1E48D8', n: '10M', t: 'Southeast Asia', sub: 'Vietnam · Indonesia · Philippines · Malaysia · Thailand · Singapore', at: [112, -1], to: [100, -14], anchor: 'end' },
  latam: { ids: [484, 76, 604, 152, 170], color: '#1F9D55', n: '2M', t: 'Latin America', sub: 'Mexico · Brazil · Peru · Chile · Colombia', at: [-60, -10], to: [-88, -30], anchor: 'end' }
};
const lookup = {}; Object.entries(regions).forEach(([k, r]) => r.ids.forEach(id => lookup[id] = k));
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r => r.json()).then(topo => {
  const land = topojson.feature(topo, topo.objects.countries);
  land.features = land.features.filter(f => +f.id !== 10);
  proj.scale(W / (2 * Math.PI)).translate([W / 2, 0]);
  const t = proj([0, 74])[1], b = proj([0, -58])[1];
  proj.translate([W / 2, H / 2 - (t + b) / 2]);
  const g = svg.append('g');
  const dots = { base: [], china: [], sea: [], latam: [] };
  const feats = land.features.map(f => ({ f, k: lookup[+f.id] || 'base', b: d3.geoBounds(f) }));
  const inB = (b, ll) => { const [[x0, y0], [x1, y1]] = b; const lon = ll[0], lat = ll[1]; if (lat < y0 || lat > y1) return false; return x0 <= x1 ? (lon >= x0 && lon <= x1) : (lon >= x0 || lon <= x1); };
  for (let y = STEP / 2; y < H; y += STEP) for (let x = STEP / 2; x < W; x += STEP) {
    const ll = proj.invert([x, y]); if (!ll || Math.abs(ll[1]) > 89) continue;
    let k = null;
    for (const o of feats) { if (inB(o.b, ll) && d3.geoContains(o.f, ll)) { k = o.k; break; } }
    if (k) dots[k].push([x, y]);
  }
  g.append('g').attr('fill', '#CFCFCA').selectAll('circle').data(dots.base).join('circle').attr('cx', d => d[0]).attr('cy', d => d[1]).attr('r', R);
  Object.entries(regions).forEach(([key, r]) => {
    g.append('g').attr('fill', r.color).selectAll('circle').data(dots[key]).join('circle').attr('cx', d => d[0]).attr('cy', d => d[1]).attr('r', R + .6);
  });
  const sg = proj([103.82, 1.35]);
  g.append('circle').attr('cx', sg[0]).attr('cy', sg[1]).attr('r', R + .6).attr('fill', regions.sea.color);
  const lg = svg.append('g');
  Object.values(regions).forEach(l => {
    const p = proj(l.at), q = proj(l.to);
    lg.append('line').attr('x1', p[0]).attr('y1', p[1]).attr('x2', q[0]).attr('y2', q[1]).attr('stroke', l.color).attr('stroke-width', 1);
    lg.append('rect').attr('x', p[0] - 5).attr('y', p[1] - 5).attr('width', 10).attr('height', 10).attr('transform', `rotate(45 ${p[0]} ${p[1]})`).attr('fill', l.color).attr('stroke', '#F4F4F2').attr('stroke-width', 2);
    const tx = l.anchor === 'end' ? q[0] - 12 : q[0] + 12;
    lg.append('text').attr('x', tx).attr('y', q[1]).attr('text-anchor', l.anchor).attr('font-family', 'Geist, sans-serif').attr('font-size', 52).attr('font-weight', 500).attr('letter-spacing', -2.2).attr('fill', '#111').text(l.n);
    lg.append('text').attr('x', tx).attr('y', q[1] + 28).attr('text-anchor', l.anchor).attr('font-family', 'Geist, sans-serif').attr('font-size', 19).attr('font-weight', 500).attr('letter-spacing', -.2).attr('fill', '#111').text(l.t + ' · MAU');
    // The region list is far wider than the number it labels, so it is broken
    // into rows of three rather than run as one band across the map.
    const parts = l.sub.split(' · ');
    const rows = [];
    for (let i = 0; i < parts.length; i += 3) rows.push(parts.slice(i, i + 3));
    rows.forEach((row, i) => {
      lg.append('text').attr('x', tx).attr('y', q[1] + 52 + i * 17).attr('text-anchor', l.anchor).attr('font-family', 'Geist Mono, monospace').attr('font-size', 12).attr('letter-spacing', 1.1).attr('fill', l.color).text(row.join(' · ').toUpperCase());
    });
  });
});
</script>
